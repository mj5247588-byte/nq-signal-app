name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses-dev cmake libffi-dev libssl-dev
          pip install buildozer cython

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          printf '\n24333f8a63b6825ea9c5514f83c2829b004d1fee' > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
          printf '\n84831b9409646a918e30573bab4c9c91346d8abd' > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license
          printf '\n601085b94cd77f0b54ff86406957099ebe79c4d6' > ~/.buildozer/android/platform/android-sdk/licenses/android-googletv-license
          printf '\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a' > ~/.buildozer/android/platform/android-sdk/licenses/google-gdk-license
          printf '\n859f317696f67ef3d7f30a50a5560e7834b43903' > ~/.buildozer/android/platform/android-sdk/licenses/mips-android-sysimage-license
          echo "✅ Licenses done"

      - name: Build APK
        run: |
          yes | buildozer android debug || true
          if [ ! -f bin/*.apk ]; then
            echo "❌ APK nahi bani, log dekh rahe hain:"
            tail -100 .buildozer/android/platform/build-arm64-v8a/dists/*/build/outputs/logs/*.txt 2>/dev/null || true
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: nq-signal-apk
          path: bin/*.apk
